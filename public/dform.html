<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formulário — Cadastro do cliente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--brand:#c0572f;--brand-d:#a8481f;--ink:#1a1c23;--ink2:#6b7280;--line:#e6e3df;--bg:#f5f4f2}
  body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;padding:28px 16px;line-height:1.5}
  .card{max-width:560px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 30px rgba(16,24,40,.07);overflow:hidden}
  .top{background:linear-gradient(120deg,var(--brand),var(--brand-d));color:#fff;padding:26px 28px}
  .top h1{font-size:21px;font-weight:800;letter-spacing:-.3px}
  .top p{font-size:13.5px;opacity:.9;margin-top:5px}
  .body{padding:22px 28px 28px}
  label{display:block;font-size:12.5px;font-weight:600;color:var(--ink2);margin:14px 0 5px}
  input{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 13px;font-size:14px;outline:none;font-family:inherit;transition:.15s}
  input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(192,87,47,.12)}
  .sec{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:#aab0b8;margin:24px 0 4px}
  .linkrow{display:flex;gap:8px;margin-bottom:8px}
  .linkrow input.lbl{flex:0 0 120px}
  .linkrow input.url{flex:1}
  .del{background:#fff5f5;border:1px solid #f3c0c2;color:#e5484d;border-radius:9px;width:42px;flex:none;cursor:pointer;font-size:15px}
  .add{width:100%;border:1px dashed #cfcac3;background:#faf9f7;color:#6a6a6a;border-radius:10px;padding:11px;font-size:13px;font-weight:600;cursor:pointer;margin-top:4px}
  .add:hover{border-color:var(--brand);color:var(--brand)}
  .submit{width:100%;background:var(--brand);color:#fff;border:0;border-radius:12px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;margin-top:24px}
  .submit:hover{background:var(--brand-d)} .submit:disabled{opacity:.6}
  .ok{text-align:center;padding:50px 28px}
  .ok .ic{width:64px;height:64px;border-radius:50%;background:#e8f7ee;color:#16a34a;display:grid;place-items:center;margin:0 auto 16px}
  .ok .ic svg{width:32px;height:32px;stroke:#16a34a;stroke-width:3;fill:none}
  .ok h2{font-size:20px;font-weight:800}.ok p{color:var(--ink2);margin-top:6px;font-size:14px}
  .err{background:#fdecec;color:#c0392b;border-radius:10px;padding:12px;font-size:13px;text-align:center;margin-top:14px;display:none}
  .foot{text-align:center;color:#aab0b8;font-size:11.5px;margin-top:16px}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="top"><h1>Cadastro do cliente</h1><p>Preencha os dados abaixo para configurarmos seu painel de acompanhamento.</p></div>
  <div class="body" id="form">
    <div class="sec">Dados da empresa</div>
    <label>Nome / Marca</label><input id="f-name" placeholder="Ex: Arroba Banda Larga">
    <label>Razão social</label><input id="f-razao" placeholder="Ex: Arroba Banda Larga LTDA">
    <label>CNPJ</label><input id="f-cnpj" placeholder="00.000.000/0001-00">
    <label>Responsável (nome e telefone)</label><input id="f-resp" placeholder="Ex: João Silva · (22) 99999-0000">
    <label>Segmento</label><input id="f-seg" placeholder="Ex: Provedor de Internet · Campos/RJ">
    <div class="sec">Links e acessos públicos</div>
    <div id="links"></div>
    <button class="add" type="button" onclick="addLink()">+ adicionar link</button>
    <button class="submit" id="btn" onclick="enviar()">Enviar cadastro</button>
    <div class="err" id="err"></div>
  </div>
</div>
<div class="foot">Formulário seguro · seus dados vão direto para a equipe.</div>
<script>
  const qs = new URLSearchParams(location.search);
  const C = qs.get('c'), T = qs.get('t');
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }
  function linkRow(l){ l=l||{}; const d=document.createElement('div'); d.className='linkrow';
    d.innerHTML='<input class="lbl" placeholder="Nome (ex: Instagram)" value="'+esc(l.label)+'"><input class="url" placeholder="https://..." value="'+esc(l.url)+'"><button class="del" type="button">&times;</button>';
    d.querySelector('.del').onclick=()=>d.remove(); document.getElementById('links').appendChild(d); }
  function addLink(){ linkRow({}); }
  async function load(){
    if(!C||!T){ showErr('Link inválido.'); return; }
    try{ const r=await fetch('/dform/'+encodeURIComponent(C)+'/data?t='+encodeURIComponent(T)); if(!r.ok){ showErr('Link inválido ou expirado.'); return; } const d=await r.json();
      f_name.value=d.name||''; f_razao.value=d.razaoSocial||''; f_cnpj.value=d.cnpj||''; f_resp.value=d.responsavel||''; f_seg.value=d.segmento||'';
      const arr=(d.links&&d.links.length)?d.links:[{label:'Site'},{label:'Instagram'},{label:'Facebook'}]; arr.forEach(linkRow);
    }catch(e){ showErr('Erro ao carregar.'); }
  }
  function showErr(m){ const e=document.getElementById('err'); e.textContent=m; e.style.display='block'; }
  async function enviar(){
    const btn=document.getElementById('btn'); btn.disabled=true; btn.textContent='Enviando...';
    const links=[...document.querySelectorAll('#links .linkrow')].map(r=>({label:r.querySelector('.lbl').value.trim(),url:r.querySelector('.url').value.trim()})).filter(l=>l.url||l.label);
    const body={ name:f_name.value.trim(), razaoSocial:f_razao.value.trim(), cnpj:f_cnpj.value.trim(), responsavel:f_resp.value.trim(), segmento:f_seg.value.trim(), links };
    try{ const r=await fetch('/dform/'+encodeURIComponent(C)+'/save?t='+encodeURIComponent(T),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      if(!r.ok){ throw new Error(); }
      document.getElementById('card').innerHTML='<div class="ok"><div class="ic"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></div><h2>Cadastro enviado!</h2><p>Obrigado. Já recebemos seus dados e vamos montar seu painel.</p></div>';
    }catch(e){ btn.disabled=false; btn.textContent='Enviar cadastro'; showErr('Não foi possível enviar. Tente novamente.'); }
  }
  load();
</script>
</body>
</html>
