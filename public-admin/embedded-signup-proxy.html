<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Conectando com a Meta...</title>
  <style>
    body { font-family: -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #111b21; color: #e9edef; }
    .box { text-align: center; padding: 2rem; max-width: 320px; }
    .spinner { width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.15); border-top-color: #00a884; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 1.2rem; }
    @keyframes spin { to { transform: rotate(360deg); } }
    h3 { margin: 0 0 0.5rem; font-size: 1.1rem; }
    .sub { font-size: 0.85rem; opacity: 0.6; margin-top: 0.5rem; }
    .err { color: #ff6b6b; }
  </style>
</head>
<body>
<div class="box">
  <div class="spinner" id="spinner"></div>
  <h3 id="msg">Iniciando conexão com a Meta...</h3>
  <p class="sub" id="sub">Aguarde enquanto carregamos o SDK da Meta.</p>
</div>
<script>
  const p = new URLSearchParams(location.search);
  const appId        = p.get('appId');
  const configId     = p.get('configId');
  const graphVersion = p.get('graphVersion') || 'v22.0';
  const mode         = p.get('mode') || 'existing';
  const slot         = p.get('slot') || '1';

  let metaSignupData = {};

  function setState(msg, sub, isErr) {
    document.getElementById('msg').textContent = msg;
    document.getElementById('msg').className = isErr ? 'err' : '';
    document.getElementById('sub').textContent = sub || '';
    document.getElementById('spinner').style.display = isErr ? 'none' : '';
  }

  function sendResult(payload) {
    if (window.opener) window.opener.postMessage({ type: 'embedded-signup-result', ...payload }, '*');
    setTimeout(() => window.close(), 1200);
  }

  // Capture session info (phoneNumberId / wabaId) sent by Facebook's own popup
  window.addEventListener('message', (event) => {
    if (!/^https:\/\/([\w-]+\.)?facebook\.com$/.test(event.origin) &&
        !/^https:\/\/([\w-]+\.)?facebook\.net$/.test(event.origin)) return;
    let d = event.data;
    if (typeof d === 'string') { try { d = JSON.parse(d); } catch { return; } }
    if (d?.type !== 'WA_EMBEDDED_SIGNUP') return;
    const inner = d.data || {};
    if (d.event === 'FINISH' || d.event === 'FINISH_WHATSAPP_BUSINESS_APP_ONBOARDING' || inner.phone_number_id || inner.waba_id) {
      metaSignupData = {
        phoneNumberId: inner.phone_number_id || inner.phoneNumberId || metaSignupData.phoneNumberId || '',
        wabaId:        inner.waba_id        || inner.wabaId        || metaSignupData.wabaId        || '',
        businessId:    inner.business_id    || inner.businessId    || metaSignupData.businessId    || ''
      };
    }
  });

  window.fbAsyncInit = function () {
    FB.init({ appId, cookie: false, xfbml: false, version: graphVersion });
    setState('Abrindo janela da Meta...', 'Conclua o fluxo na janela que abrir.');

    // Se a janela da Meta não abrir em alguns segundos, o navegador provavelmente bloqueou o popup.
    const stuckTimer = setTimeout(() => {
      setState(
        'O navegador pode ter bloqueado a janela da Meta.',
        'Permita popups para envio.gestorwagnnerpires.com.br (ícone na barra de endereço) e feche esta janela para tentar de novo.',
        true
      );
    }, 20000);
    window.__clearStuckTimer = () => clearTimeout(stuckTimer);

    const extras = slot === '1'
      ? { setup: { mode }, sessionInfoVersion: '3', ...(mode === 'existing' ? { featureType: 'whatsapp_business_app_onboarding' } : {}) }
      : { setup: {}, sessionInfoVersion: '3' };

    FB.login((response) => {
      window.__clearStuckTimer();
      const code = response?.authResponse?.code;
      if (!code) {
        setState('Conexão cancelada.', 'Você pode fechar esta janela.', true);
        sendResult({ error: 'cancelled', slot });
        return;
      }
      setState('Autorizado!', 'Aguarde, finalizando configuração...');
      sendResult({ code, slot, ...metaSignupData });
    }, {
      config_id: configId,
      response_type: 'code',
      override_default_response_type: true,
      scope: 'whatsapp_business_management,whatsapp_business_messaging,business_management',
      extras
    });
  };

  const js = document.createElement('script');
  js.async = true; js.defer = true;
  js.src = 'https://connect.facebook.net/pt_BR/sdk.js';
  js.onerror = () => {
    setState('Não foi possível carregar o SDK da Meta.', 'Verifique sua conexão e tente novamente.', true);
    sendResult({ error: 'sdk_load_failed', slot });
  };
  document.head.appendChild(js);
</script>
</body>
</html>
